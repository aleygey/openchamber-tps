<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TPS Meter</title>
  <link rel="stylesheet" href="../ui/style.css">
</head>
<body data-mode="status">
  <main id="root">
    <h1 class="panel-only">TPS Meter <small>1.1.1-auth.1</small></h1>
    <div class="readout"><span class="value" id="value">—</span><span class="unit">tok/s</span><span class="badge" id="badge">connecting</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="notice" id="notice" role="status"></div>
    <section id="auth" class="auth" hidden role="group" aria-label="TPS authentication">
      <div class="server" id="server"></div>
      <div class="login-row">
        <input id="password" type="password" autocomplete="off" maxlength="4096" required aria-label="OpenChamber UI password">
        <button type="button" id="login">Sign in</button>
      </div>
      <label class="confirm" id="http-confirm" hidden>
        <input id="allow-http" type="checkbox"><span id="http-text"></span>
      </label>
      <p class="hint" id="auth-hint"></p>
      <div class="notice error" id="auth-error" role="alert"></div>
    </section>
    <section class="panel-only details">
      <div id="session" class="hint"></div>
      <dl id="details"></dl>
      <div class="actions"><button id="retry" type="button">Retry</button><button id="forget" type="button">Forget TPS login</button></div>
      <p class="hint" id="estimate-hint"></p>
    </section>
  </main>
  <script src="../ui/host-bridge.js"></script>
  <script src="../ui/app.js"></script>
</body>
</html>
